name: fetch current programs

on:
  push:
    branches:
      - 蹦蹦
  workflow_dispatch:
  schedule:
    - cron: "0 0 */1 * *"

jobs:
  FetchMProgram:
    concurrency:
      group: course-data-gh-pages
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - name: Install npm packages
        run: npm ci
      - name: Fetch micro program data
        run: node fetchMProgram.js
      - name: Fetch general program data
        run: node fetchPrograms.js
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          keep_files: true
