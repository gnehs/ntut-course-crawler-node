name: fetch current programs

on:
  push:
    branches:
      - 蹦蹦
  workflow_dispatch:
  schedule:
    - cron: "0 0 */1 * *"

permissions:
  contents: read

jobs:
  FetchMProgram:
    name: Fetch micro program data
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
      - uses: actions/setup-node@v7
        timeout-minutes: 5
        with:
          node-version: 24
          cache: npm
      - name: Install npm packages
        timeout-minutes: 5
        run: npm ci
      - name: Fetch micro program data
        timeout-minutes: 15
        run: node fetchMProgram.js
      - name: Upload micro program artifact
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: mprogram-data
          path: dist/*/*/mprogram.json
          if-no-files-found: error
          retention-days: 2

  FetchPrograms:
    name: Fetch general program data
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
      - uses: actions/setup-node@v7
        timeout-minutes: 5
        with:
          node-version: 24
          cache: npm
      - name: Install npm packages
        timeout-minutes: 5
        run: npm ci
      - name: Fetch general program data
        timeout-minutes: 15
        run: node fetchPrograms.js
      - name: Upload general program artifact
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: programs-data
          path: dist/*/*/programs.json
          if-no-files-found: error
          retention-days: 2

  Deploy:
    name: Deploy available datasets
    if: ${{ !cancelled() }}
    needs: [FetchMProgram, FetchPrograms]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: course-data-gh-pages
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
      - name: Download micro program artifact
        if: ${{ !cancelled() && needs.FetchMProgram.result == 'success' }}
        uses: actions/download-artifact@v8
        timeout-minutes: 2
        with:
          name: mprogram-data
          path: publish
      - name: Download general program artifact
        if: ${{ !cancelled() && needs.FetchPrograms.result == 'success' }}
        uses: actions/download-artifact@v8
        timeout-minutes: 2
        with:
          name: programs-data
          path: publish
      - name: Refuse an empty deployment
        timeout-minutes: 1
        if: ${{ !cancelled() && needs.FetchMProgram.result != 'success' && needs.FetchPrograms.result != 'success' }}
        run: |
          echo "All dataset fetches failed; refusing to publish an empty deployment."
          exit 1
      - name: Deploy available datasets to GitHub Pages
        if: ${{ !cancelled() && (needs.FetchMProgram.result == 'success' || needs.FetchPrograms.result == 'success') }}
        timeout-minutes: 10
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish
          keep_files: true
          commit_message: "chore(data): refresh program datasets"
